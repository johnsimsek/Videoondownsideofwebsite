<!-- /reels-instagram-like-fi.html -->
<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Reels-syöte</title>
    <style>
      :root{
        --bg:#07070a;
        --stroke:rgba(255,255,255,.10);
        --shadow:0 24px 70px rgba(0,0,0,.60);
        --radius:18px;
      }
      *{ box-sizing:border-box; }
      html,body{ height:100%; }
      body{
        margin:0;
        background:var(--bg);
        overflow:hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color:#fff;
      }

      .feed{
        height:100vh;
        height:100dvh;
        overflow-y:auto;
        scroll-snap-type:y mandatory;
        -webkit-overflow-scrolling:touch;
        background:#000;
      }

      .item{
        height:100vh;
        height:100dvh;
        scroll-snap-align:start;
        position:relative;
        background:#000;
      }

      .reel{
        position:absolute;
        inset:0;
        background:#000;
        overflow:hidden;
        isolation:isolate;
      }

      video{
        width:100%;
        height:100%;
        display:block;
        background:#000;
        object-fit:cover;
      }

      .topFade{
        position:absolute;
        left:0; right:0; top:0;
        height:140px;
        background:linear-gradient(to bottom, rgba(0,0,0,.65), rgba(0,0,0,0));
        pointer-events:none;
        z-index:3;
      }
      .botFade{
        position:absolute;
        left:0; right:0; bottom:0;
        height:220px;
        background:linear-gradient(to top, rgba(0,0,0,.70), rgba(0,0,0,0));
        pointer-events:none;
        z-index:3;
      }

      .tapOverlay{
        position:absolute;
        inset:0;
        display:grid;
        place-items:center;
        pointer-events:none;
        z-index:4;
      }
      .playPulse{
        width:86px; height:86px;
        border-radius:999px;
        border:1px solid rgba(255,255,255,.18);
        background:rgba(0,0,0,.35);
        backdrop-filter: blur(10px);
        display:grid;
        place-items:center;
        opacity:0;
        transform: translateY(6px);
        transition: opacity .15s ease, transform .15s ease;
      }
      .reel.is-paused .playPulse{ opacity:1; transform: translateY(0); }
      .playPulse svg{ width:34px; height:34px; fill:#fff; margin-left:3px; }

      .rail{
        position:absolute;
        right:12px;
        bottom:92px;
        display:flex;
        flex-direction:column;
        gap:16px;
        z-index:5;
        pointer-events:auto;
      }

      .action{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:6px;
        user-select:none;
      }

      .btn{
        width:46px;
        height:46px;
        border-radius:999px;
        border:1px solid rgba(255,255,255,.14);
        background:rgba(0,0,0,.25);
        backdrop-filter: blur(10px);
        display:grid;
        place-items:center;
        cursor:pointer;
        transition: transform .08s ease, background .12s ease;
      }
      .btn:hover{ background: rgba(0,0,0,.38); }
      .btn:active{ transform: translateY(1px); }
      .btn svg{ width:22px; height:22px; fill:#fff; }

      .count{
        font-size:12px;
        color:rgba(255,255,255,.95);
        text-shadow: 0 6px 22px rgba(0,0,0,.65);
      }

      .btn.like.is-on svg{ fill:#ff2d55; }
      .btn.save.is-on svg{ fill:#ffd60a; }

      .controls{
        position:absolute;
        left:0; right:0;
        bottom:0;
        padding: 0 12px max(12px, env(safe-area-inset-bottom));
        z-index:6;
        pointer-events:none;
      }

      .progressWrap{
        pointer-events:auto;
        padding-bottom: 10px;
      }

      .progress{
        width:100%;
        height:3px;
        border-radius:999px;
        background: rgba(255,255,255,.22);
        appearance:none;
        outline:none;
        cursor:pointer;
      }
      .progress::-webkit-slider-thumb{
        appearance:none;
        width:14px;
        height:14px;
        border-radius:999px;
        background:#fff;
        border:0;
        box-shadow: 0 0 0 6px rgba(255,255,255,.12);
      }
      .progress::-moz-range-thumb{
        width:14px;
        height:14px;
        border-radius:999px;
        background:#fff;
        border:0;
        box-shadow: 0 0 0 6px rgba(255,255,255,.12);
      }

      .bottomRow{
        pointer-events:auto;
        display:flex;
        align-items:center;
        justify-content:flex-end;
        gap:10px;
      }
      .miniBtn{
        width:42px;
        height:42px;
        border-radius:999px;
        border:1px solid rgba(255,255,255,.14);
        background:rgba(0,0,0,.25);
        backdrop-filter: blur(10px);
        display:grid;
        place-items:center;
        cursor:pointer;
        transition: transform .08s ease, background .12s ease;
      }
      .miniBtn:hover{ background: rgba(0,0,0,.38); }
      .miniBtn:active{ transform: translateY(1px); }
      .miniBtn svg{ width:20px; height:20px; fill:#fff; }

      @media (max-width:420px){
        .rail{ right:10px; bottom:86px; }
      }
    </style>

    <script>
      const ICONS = {
        vol: '<path d="M3 10v4h4l5 4V6L7 10H3z"></path>',
        mute:
          '<path d="M3 10v4h4l5 4V6L7 10H3z"></path>' +
          '<path d="M16 9l5 5m0-5l-5 5" stroke="white" stroke-width="2" stroke-linecap="round"></path>',
      };

      function clamp(n, a, b){ return Math.min(b, Math.max(a, n)); }

      function parseLike(text){
        const t = text.toUpperCase().replace(",", ".");
        if (t.endsWith("K")) return Math.round(parseFloat(t) * 1000);
        if (t.endsWith("M")) return Math.round(parseFloat(t) * 1000000);
        const n = parseInt(t.replace(/\D/g, ""), 10);
        return Number.isFinite(n) ? n : 0;
      }

      function formatLikeFi(n){
        if (n >= 1000000) return (Math.round((n/1000000)*10)/10).toString().replace(".", ",") + "M";
        if (n >= 1000) return (Math.round((n/1000)*10)/10).toString().replace(".", ",") + "K";
        return String(n);
      }

      function setupReel(root){
        const video = root.querySelector("[data-video]");
        const seek = root.querySelector("[data-seek]");
        const muteBtn = root.querySelector("[data-mute]");
        const muteIcon = root.querySelector("[data-mute-icon]");

        const likeBtn = root.querySelector("[data-like]");
        const likeCountEl = root.querySelector("[data-like-count]");
        const saveBtn = root.querySelector("[data-save]");
        const commentBtn = root.querySelector("[data-comment]");
        const shareBtn = root.querySelector("[data-share]");

        let liked = false;
        let saved = false;

        function setPausedUI(paused){
          root.classList.toggle("is-paused", paused);
        }

        function setMuteUI(muted){
          muteIcon.innerHTML = muted ? ICONS.mute : ICONS.vol;
        }

        function syncSeek(){
          const dur = video.duration || 0;
          if (dur <= 0) return;
          seek.value = String(Math.round((video.currentTime / dur) * 1000));
        }

        function seekTo(val){
          const dur = video.duration || 0;
          if (dur <= 0) return;
          video.currentTime = dur * (Number(val) / 1000);
        }

        async function togglePlay(){
          if (video.paused){
            try { await video.play(); } catch (_){}
          } else {
            video.pause();
          }
        }

        video.addEventListener("click", togglePlay);
        seek.addEventListener("input", () => seekTo(seek.value));
        video.addEventListener("timeupdate", syncSeek);
        video.addEventListener("loadedmetadata", syncSeek);
        video.addEventListener("play", () => setPausedUI(false));
        video.addEventListener("pause", () => setPausedUI(true));

        muteBtn.addEventListener("click", () => {
          video.muted = !video.muted;
          if (!video.muted && video.volume === 0) video.volume = 1;
          setMuteUI(video.muted || video.volume === 0);
        });
        video.addEventListener("volumechange", () => {
          setMuteUI(video.muted || video.volume === 0);
        });

        likeBtn?.addEventListener("click", () => {
          liked = !liked;
          likeBtn.classList.toggle("is-on", liked);
          if (!likeCountEl) return;
          const n = parseLike(likeCountEl.textContent.trim());
          const next = clamp(n + (liked ? 1 : -1), 0, 999999999);
          likeCountEl.textContent = formatLikeFi(next);
        });

        saveBtn?.addEventListener("click", () => {
          saved = !saved;
          saveBtn.classList.toggle("is-on", saved);
        });

        commentBtn?.addEventListener("click", () => {
          alert("Kommentit (demo)");
        });

        shareBtn?.addEventListener("click", async () => {
          const url = location.href;
          try{
            if (navigator.share) await navigator.share({ title: document.title, url });
            else await navigator.clipboard.writeText(url);
          } catch(_){}
        });

        video.muted = true;
        video.volume = 0;
        setMuteUI(true);
        setPausedUI(true);

        return { root, video };
      }

      const reels = [...document.querySelectorAll("[data-reel]")].map(setupReel);

      const io = new IntersectionObserver((entries) => {
        for (const e of entries){
          const r = reels.find(x => x.root === e.target);
          if (!r) continue;

          if (e.isIntersecting && e.intersectionRatio >= 0.75){
            for (const other of reels){
              if (other !== r && !other.video.paused) other.video.pause();
            }
            r.video.play().catch(() => {});
          } else {
            if (!r.video.paused) r.video.pause();
          }
        }
      }, { threshold: [0, 0.75, 1] });

      reels.forEach(r => io.observe(r.root));

      let scrollT;
      const feed = document.getElementById("feed");
      feed.addEventListener("scroll", () => {
        clearTimeout(scrollT);
        scrollT = setTimeout(() => {
          const vh = feed.clientHeight || window.innerHeight;
          const idx = Math.round(feed.scrollTop / vh);
          feed.scrollTo({ top: idx * vh, behavior: "smooth" });
        }, 120);
      });
    </script>
